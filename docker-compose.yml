services:
  # Web server Nginx - menampilkan halaman ke browser
  nginx:
    image: nginx:alpine
    container_name: testdocker-nginx
    ports:
      - "8082:80"
    volumes:
      - ./web:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # PHP-FPM - memproses file .php yang diminta oleh Nginx
  # Menggunakan image custom dengan ekstensi Redis & PDO MySQL (lihat ./php/Dockerfile)
  php:
    build: ./php
    container_name: testdocker-php
    volumes:
      - ./web:/var/www/html
    depends_on:
      - redis
      - mariadb
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_DATABASE=app_db
      - MARIADB_USER=app_user
      - MARIADB_PASSWORD=app_pass

  # Redis - penyimpanan data in-memory
  redis:
    image: redis:7-alpine
    container_name: testdocker-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data

  # MariaDB - database relasional
  mariadb:
    image: mariadb:11
    container_name: testdocker-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=rootpass
      - MARIADB_DATABASE=app_db
      - MARIADB_USER=app_user
      - MARIADB_PASSWORD=app_pass
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  mariadb-data: