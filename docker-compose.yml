services:
  # Web server Nginx - menampilkan halaman ke browser
  nginx:
    image: nginx:alpine
    container_name: testdocker-nginx
    ports:
      - "8082:80"
    volumes:
      - ./web:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # PHP-FPM - memproses file .php yang diminta oleh Nginx
  # Menggunakan image custom dengan ekstensi Redis & PDO MySQL (lihat ./php/Dockerfile)
  php:
    build: ./php
    container_name: testdocker-php
    # Agar container bisa mengakses MySQL yang berjalan di mesin host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MARIADB_HOST=host.docker.internal
      - MARIADB_PORT=3306
      - MARIADB_DATABASE=${MYSQL_DATABASE:-app_db}
      - MARIADB_USER=${MYSQL_USER:-root}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD:-change_me}

  # Redis - penyimpanan data in-memory
  redis:
    image: redis:7-alpine
    container_name: testdocker-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data: