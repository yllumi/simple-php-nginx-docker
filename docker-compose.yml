services:
  # Web server Nginx - menampilkan halaman ke browser
  nginx:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # PHP-FPM - memproses file .php yang diminta oleh Nginx
  # Menggunakan image custom dengan ekstensi Redis (lihat ./php/Dockerfile)
  php:
    build: ./php
    container_name: php-fpm
    volumes:
      - ./web:/var/www/html
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Redis - penyimpanan data in-memory
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data: